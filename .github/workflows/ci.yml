name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  auth-lint-test:
    name: Auth service — format, lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            auth/requirements.txt
            auth/requirements-test.txt

      - name: Install dependencies
        run: pip install -r auth/requirements.txt -r auth/requirements-test.txt

      - name: Format (black --check)
        run: black auth/main.py auth/tests/ --check --line-length=99

      - name: Lint (flake8)
        run: flake8 auth/main.py auth/tests/ --max-line-length=99

      - name: Test (pytest)
        working-directory: auth
        run: pytest tests/ -v

  voicebox-proxy-lint-test:
    name: Voicebox proxy — format, lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            voicebox-proxy/requirements.txt
            voicebox-proxy/requirements-test.txt

      - name: Install dependencies
        run: pip install -r voicebox-proxy/requirements.txt -r voicebox-proxy/requirements-test.txt

      - name: Format (black --check)
        run: black voicebox-proxy/main.py voicebox-proxy/tests/ --check --line-length=99

      - name: Lint (flake8)
        run: flake8 voicebox-proxy/main.py voicebox-proxy/tests/ --max-line-length=99

      - name: Test (pytest)
        working-directory: voicebox-proxy
        run: pytest tests/ -v

  doc-extract-lint-test:
    name: Doc extract — format, lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            doc-extract/requirements.txt
            doc-extract/requirements-test.txt

      - name: Install dependencies
        run: pip install -r doc-extract/requirements.txt -r doc-extract/requirements-test.txt

      - name: Format (black --check)
        run: black doc-extract/main.py doc-extract/tests/ --check --line-length=99

      - name: Lint (flake8)
        run: flake8 doc-extract/main.py doc-extract/tests/ --max-line-length=99

      - name: Test (pytest)
        working-directory: doc-extract
        run: pytest tests/ -v

  piper-tts-lint-test:
    name: Piper TTS — format, lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            piper-tts/requirements.txt
            piper-tts/requirements-test.txt

      - name: Install dependencies
        run: pip install -r piper-tts/requirements.txt -r piper-tts/requirements-test.txt

      - name: Format (black --check)
        run: black piper-tts/main.py piper-tts/tests/ --check --line-length=99

      - name: Lint (flake8)
        run: flake8 piper-tts/main.py piper-tts/tests/ --max-line-length=99

      - name: Test (pytest)
        working-directory: piper-tts
        run: pytest tests/ -v

  frontend-lint:
    name: Frontend — ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Lint (eslint)
        run: npm run lint:js

      - name: Lint (htmlhint)
        run: npm run lint:html

      - name: SRI check — pinned vendored assets match index.html on a clean checkout
        run: npm run check:sri

      - name: Test (jest)
        run: npm run test:js

  nginx-config-check:
    name: Nginx — config syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Drift guard — committed nginx.conf matches the template render
        run: |
          sh deploy/nginx/render-nginx-conf.sh > /tmp/rendered.conf
          diff /tmp/rendered.conf deploy/nginx/nginx.conf \
            || { echo "::error::deploy/nginx/nginx.conf is stale — regenerate with deploy/nginx/render-nginx-conf.sh"; exit 1; }

      - name: Cloud-render sanity — placeholders all substitute
        run: |
          AUTH_UPSTREAM=vpal-auth.internal:9000 \
          VOICEBOX_PROXY_UPSTREAM=vpal-vb.internal:8002 \
          DOC_EXTRACT_UPSTREAM=vpal-de.internal:8003 \
          PIPER_UPSTREAM=vpal-piper.internal:8004 \
          OLLAMA_UPSTREAM=ollama.internal:11434 \
          SERVER_NAME=vpal.example.com \
          SSL_CERT_PATH=/tls/fullchain.pem \
          SSL_KEY_PATH=/tls/privkey.pem \
          sh deploy/nginx/render-nginx-conf.sh > /tmp/cloud.conf
          if grep -q '\${' /tmp/cloud.conf; then
            echo "::error::unsubstituted \${...} placeholder left in the cloud render"; exit 1
          fi
          grep -q 'vpal.example.com' /tmp/cloud.conf || { echo "::error::SERVER_NAME not substituted"; exit 1; }
          grep -q 'ollama.internal:11434' /tmp/cloud.conf || { echo "::error::OLLAMA_UPSTREAM not substituted"; exit 1; }

      - name: Generate dummy TLS certificates
        run: |
          mkdir -p deploy/certs
          openssl req -x509 -newkey rsa:2048 \
            -keyout deploy/certs/localhost-key.pem \
            -out deploy/certs/localhost.pem \
            -days 1 -nodes -subj "/CN=localhost"

      - name: Validate nginx config syntax
        run: |
          docker run --rm \
            --add-host auth:127.0.0.1 \
            --add-host voicebox-proxy:127.0.0.1 \
            --add-host doc-extract:127.0.0.1 \
            --add-host piper-tts:127.0.0.1 \
            --add-host host.docker.internal:127.0.0.1 \
            -v "${{ github.workspace }}/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "${{ github.workspace }}/deploy/certs/localhost.pem:/etc/nginx/ssl/localhost.pem:ro" \
            -v "${{ github.workspace }}/deploy/certs/localhost-key.pem:/etc/nginx/ssl/localhost-key.pem:ro" \
            nginx:1.27-alpine nginx -t
