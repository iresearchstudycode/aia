name: vpal

services:
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: vpal-auth
    restart: unless-stopped
    env_file: .env

    # Security: non-root (uid 65532, Chainguard default), read-only root, no capabilities
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
          pids: 30

    # Port exposed only within the Docker network — never published to the host
    expose:
      - "9000"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  voicebox-proxy:
    build:
      context: ./voicebox-proxy
      dockerfile: Dockerfile
    container_name: vpal-voicebox-proxy
    restart: unless-stopped
    env_file: .env

    # Connects the container to your Windows host network gateway so it can
    # reach the local Voicebox desktop app (127.0.0.1:17493 on the host).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Security: non-root (uid 65532, Chainguard default), read-only root, no capabilities
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
          pids: 30

    # Port exposed only within the Docker network — never published to the host
    expose:
      - "8002"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  doc-extract:
    build:
      context: ./doc-extract
      dockerfile: Dockerfile
    container_name: vpal-doc-extract
    restart: unless-stopped
    env_file: .env

    # Security: non-root (uid 65532, Chainguard default), read-only root, no capabilities
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: '0.50'
          # Higher than auth/voicebox-proxy's 128M — parsing a PDF up to the
          # 15 MB upload limit needs more headroom than simple JSON/HTTP handling.
          memory: 256M
          pids: 30

    # Port exposed only within the Docker network — never published to the host
    expose:
      - "8003"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  piper-tts:
    build:
      context: ./piper-tts
      dockerfile: Dockerfile
    container_name: vpal-piper-tts
    restart: unless-stopped
    env_file: .env

    # Self-contained — the voice model is baked into the image; no host service
    # to reach, so (unlike voicebox-proxy) no extra_hosts entry.

    environment:
      # onnxruntime writes a cache/telemetry marker on first run; give it a home.
      - HOME=/tmp
      # Pin every native thread pool to 1 (also set in the Dockerfile — kept
      # here too so it's visible/overridable at the compose layer). Without
      # this, onnxruntime/OpenMP size their pools to the host core count,
      # which under the cpus + pids limits below deadlocks during pool
      # creation — the request never returns and eventually /health hangs.
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - ORT_NUM_THREADS=1
      - PIPER_ORT_THREADS=1

    # Security: non-root (uid 65532), read-only root, no capabilities
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: '1.00'
          # ONNX voice model (~63 MB) held in memory alongside onnxruntime +
          # numpy; measured peak RSS is ~220 MB, so 768M is generous margin.
          memory: 768M
          # onnxruntime + uvicorn's threadpool spawn a handful of native
          # threads each (all counted against this ceiling on Linux); 30 was
          # too tight and contributed to the thread-pool-init hang.
          pids: 128

    # Port exposed only within the Docker network — never published to the host
    expose:
      - "8004"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Eager model load (PIPER_EAGER_LOAD) runs during startup, so give the
      # first healthcheck room before counting failures.
      start_period: 40s

  settings-service:
    build:
      context: ./settings-service
      dockerfile: Dockerfile
    container_name: vpal-settings
    restart: unless-stopped
    env_file: .env

    # Self-contained — per-user preferences in a stdlib-sqlite3 database on a
    # persistent named volume; no external app or host service to reach.
    environment:
      # SQLite database location — inside the vpal-settings-data named volume,
      # which stays writable even though the root FS is read-only.
      - SETTINGS_DB_PATH=/data/settings.db

    # Security: non-root (uid 65532, Chainguard default), read-only root, no capabilities
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Persistent storage for the SQLite database (+ its -wal / -shm files).
    # A named volume, NOT tmpfs — settings must survive a container restart.
    volumes:
      - vpal-settings-data:/data

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
          pids: 30

    # Port exposed only within the Docker network — never published to the host
    expose:
      - "8005"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web-server:
    # Digest-pinned for reproducibility, matching the Python services' Dockerfiles.
    # Update with: docker pull cgr.dev/chainguard/nginx:latest  (copy the Digest: line)
    image: cgr.dev/chainguard/nginx:latest@sha256:f801aa4ac908f6c3847efe81b577e4f34e1f237b5556dfbe698127ad464db269
    container_name: vpal-nginx
    restart: unless-stopped

    # Nginx starts only after the auth, voicebox-proxy, doc-extract,
    # piper-tts, and settings-service services are healthy
    depends_on:
      auth:
        condition: service_healthy
      voicebox-proxy:
        condition: service_healthy
      doc-extract:
        condition: service_healthy
      piper-tts:
        condition: service_healthy
      settings-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "/usr/sbin/nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Network Hardening: Bind only to local loopback to prevent LAN exposure
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"

    # Connects the container to your Windows host network gateway for Ollama resolution
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Security Profiles & Privilege Escalation Restrictions
    security_opt:
      - no-new-privileges:true

    # Drop all default kernel privileges except standard web serving permissions
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # Required to bind port 443 as non-root (uid=65532)

    # Resource Hardening: Integrated seamlessly without configuration duplication
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 50

    # Read-Only Root Filesystem with explicit ephemeral overrides for Nginx system files
    read_only: true
    tmpfs:
      - /var/lib/nginx/tmp:uid=65532,gid=65532,mode=0755
      - /var/run:uid=65532,gid=65532,mode=0755

    # Host File Access: Bind mounts marked explicitly as Read-Only
    volumes:
      # Static HTML/JS/CSS files from your Windows 11 host
      - type: bind
        source: ./src/aia
        target: /usr/share/nginx/html
        read_only: true
      # HTTPS SSL/TLS Certificates generated by mkcert
      - type: bind
        source: ./deploy/certs
        target: /etc/nginx/ssl
        read_only: true
      # Local Nginx configuration file — the local-default render of
      # deploy/nginx/nginx.conf.template (via deploy/nginx/render-nginx-conf.sh).
      # Edit the .template and regenerate; do not hand-edit nginx.conf.
      # Full runtime/init-container templating for cloud is a deferred follow-up
      # (docs/cloud-hardening-plan.md, Finding E).
      - type: bind
        source: ./deploy/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true

# Named volumes
volumes:
  # Persistent SQLite store for settings-service (per-user preferences).
  # Survives container recreation; lives under Docker's volume storage.
  vpal-settings-data:
