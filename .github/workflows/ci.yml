name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  auth-lint-test:
    name: Auth service — format, lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            auth/requirements.txt
            auth/requirements-test.txt

      - name: Install dependencies
        run: pip install -r auth/requirements.txt -r auth/requirements-test.txt

      - name: Format (black --check)
        run: black auth/main.py auth/tests/ --check --line-length=99

      - name: Lint (flake8)
        run: flake8 auth/main.py auth/tests/ --max-line-length=99

      - name: Test (pytest)
        working-directory: auth
        run: pytest tests/ -v

  frontend-lint:
    name: Frontend — ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Lint (eslint)
        run: npm run lint:js
