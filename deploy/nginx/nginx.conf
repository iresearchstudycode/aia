worker_processes  auto;

# Redirect system logs to standard output streams for Docker logging visibility
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Information Masking
    server_tokens off;

    # Send logs to stdout so they appear in 'docker logs'
    access_log  /dev/stdout;

    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 100;

    # HTTP Server: Redirect to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen       443 ssl;
        server_name  localhost;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self';" always;

        # Linux-compatible volume paths matching your docker setup
        ssl_certificate      /etc/nginx/ssl/localhost.pem;
        ssl_certificate_key  /etc/nginx/ssl/localhost-key.pem;

        # TLS Session and Protocol Hardening
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # Root static files directory inside standard Nginx container
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Safer global method restriction instead of using 'if'
        location / {
            limit_except GET HEAD POST PUT DELETE {
                deny all;
            }
        }

        # Custom Error Pages
        error_page 400 401 402 403 404 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }

        # Ollama API Reverse Proxy
        location /ollama/ {
            # Trailing slash on proxy_pass strips the /ollama/ prefix before forwarding.
            # host.docker.internal resolves to the Windows host via extra_hosts in docker-compose.yml.
            proxy_pass http://host.docker.internal:11434/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming support — disable buffering so chunks reach the browser in real time
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
