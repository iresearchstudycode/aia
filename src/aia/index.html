<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <link rel="icon" href="images/icon.ico" type="image/x-icon">
  <title>AI Assistant (Local)</title>
  <link rel="stylesheet" href="css/katex.min.css"
    integrity="sha256-D7cRycdMsXGGYZM5SLZT+8CaYn2l3eiSa00QWFNwmT4=">
  <link rel="stylesheet" href="css/highlight.min.css"
    integrity="sha256-Qjf/ynzmqttDjEV+CmdbElxTS73aW4f0HzoUlWA7zJs=">
  <link rel="stylesheet" href="css/style.css">

  <script type="application/javascript" src="./scripts/marked.min.js"
    integrity="sha256-YAKvY0hbBD+mDdq6GzQ2O5jSqLLGO2BwBPOiQFqKBTo="></script>
  <script type="application/javascript" src="./scripts/dompurify.min.js"
    integrity="sha256-26u1sgWjM+xJyMCef8ow72bfBSO7i8D6nqhDhB8RHb0="></script>
  <script type="application/javascript" src="./scripts/highlight.min.js"
    integrity="sha256-xKOZ3W9Ii8l6NUbjR2dHs+cUyZxXuUcxVMb7jSWbk4E="></script>
  <script type="application/javascript" src="./scripts/katex.min.js"
    integrity="sha256-aLkRVRC4ztuZCaEN53mclMBwdIEpb3VcCoiIy4/N4hY="></script>
  <script type="application/javascript" src="./scripts/katex-auto-render.min.js"
    integrity="sha256-5TctGZvNrotN5x0PfOunKkuhJ3SifGCm8fd9A7MijuQ="></script>
  <script type="application/javascript" src="./scripts/diff-match-patch.js"
    integrity="sha256-mnnPAxrHwuNmQWGBBRrLPm0srPecU1QUj0xx6iDH5KM="></script>
  <script type="application/javascript" src="./scripts/mermaid.min.js"
    integrity="sha256-Wo7JGCC9Va/vBJBoSJNpkQ5dbOcMgQOVLyfinT526Lw="></script>
  <script type="application/javascript" src="./scripts/config.js"></script>
  <script type="application/javascript" src="./scripts/utils.js"></script>
  <script type="application/javascript" src="./scripts/speech.js"></script>
  <script type="application/javascript" src="./scripts/chat.js"></script>
  <script type="application/javascript" src="./scripts/api.js"></script>
  <script type="application/javascript" src="./scripts/nav-rail.js"></script>
  <script type="application/javascript" src="./scripts/settings.js"></script>
  <script type="application/javascript" src="./scripts/history.js"></script>
  <script type="application/javascript" src="./scripts/main.js"></script>
</head>

<body>
  <div class="app" id="app">

    <!-- ============ Left sidebar ============ -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-top">
        <button type="button" id="newChatBtn" class="sidebar-new-chat">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <line x1="12" y1="8" x2="12" y2="14"/>
            <line x1="9" y1="11" x2="15" y2="11"/>
          </svg>
          New chat
        </button>
        <button type="button" id="sidebarCollapseBtn" class="sidebar-icon-btn"
          aria-label="Collapse sidebar" title="Collapse sidebar (Ctrl/Cmd+B)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-search">
        <input type="text" id="historySearch" placeholder="Search conversations"
          aria-label="Search conversations">
        <label class="sidebar-search-body" for="historySearchBodyToggle">
          <input type="checkbox" id="historySearchBodyToggle">
          <span>search message text</span>
        </label>
      </div>

      <div class="sidebar-list" id="historyList"></div>
      <div id="historyEmpty" hidden>No saved conversations yet.</div>

      <div id="historyFooter">
        <div class="history-footer-meta">
          <span id="historyCount"></span>
          <span id="historyStorage" class="history-storage"></span>
        </div>
      </div>

      <button type="button" id="accountTrigger" class="sidebar-user"
        aria-haspopup="true" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="sidebar-user-avatar" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span id="profileName"></span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          class="sidebar-user-caret" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </aside>

    <!-- ============ Main pane ============ -->
    <div class="app-main" id="appMain">
      <header class="app-main-header">
        <button type="button" id="sidebarToggleBtn" class="header-hamburger"
          aria-label="Toggle sidebar" title="Toggle sidebar (Ctrl/Cmd+B)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="header-title">
          <div class="title-main">
            <!-- Chat bubble with three dots — AI identity mark -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
              class="header-bot-icon" aria-hidden="true">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="10" r="1" fill="currentColor" stroke="none"/>
              <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/>
            </svg>
            <span>AI Assistant</span>
            <button type="button" id="personaToggleBtn" class="persona-toggle-btn"
              aria-haspopup="dialog" title="Open Settings to choose a persona">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
          </div>
          <div id="currentPersonaLabel" class="current-persona-label"></div>
        </div>
        <button type="button" id="chatOverflowBtn" class="chat-overflow-btn"
          aria-haspopup="menu" aria-expanded="false" aria-label="Chat actions" title="Chat actions">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="2"/>
            <circle cx="12" cy="12" r="2"/>
            <circle cx="19" cy="12" r="2"/>
          </svg>
        </button>
      </header>

      <div class="chat-messages" id="chatMessages" role="log" aria-label="Chat messages" aria-live="polite">
        <!-- Chat messages will appear here -->
      </div>

      <input type="file" id="openInput" accept="application/json,.json">
      <input type="file" id="imageInput" accept="image/*">
      <input type="file" id="documentInput" accept=".txt,.md,.markdown,.pdf,text/plain,text/markdown,application/pdf">

      <div class="chat-input">
      <div class="chat-input-container">
        <div class="image-preview-strip" id="imagePreviewStrip">
          <img id="imagePreviewThumb" class="image-preview-thumb" alt="Image to attach">
          <button type="button" id="removeImageBtn" class="remove-image-btn" aria-label="Remove attached image">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="document-preview-strip" id="documentPreviewStrip">
          <svg class="document-preview-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <span id="documentPreviewName" class="document-preview-name"></span>
          <button type="button" id="removeDocumentBtn" class="remove-image-btn" aria-label="Remove attached document">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <textarea id="userInput" rows="1" aria-label="Message"
          placeholder="Message AI Assistant — Shift+Enter for new line..."></textarea>
        <div class="chat-input-toolbar">
          <div class="toolbar-left">
            <!-- Settings badges — read-only status chips; clicking either opens
                 the Settings lightbox. Text is filled by applyResolvedSettings(). -->
            <button type="button" id="modelBadge" class="settings-badge"
              title="Model — click to open Settings"></button>
            <button type="button" id="thinkingBadge" class="settings-badge"
              title="Thinking — click to open Settings"></button>
            <!-- Microphone -->
            <button type="button" class="voice-btn toolbar-icon-btn" id="micBtn"
              aria-label="Toggle voice input" aria-pressed="false"
              title="Toggle Continuous Speech Recognition — say 'stop listening' or click to stop">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>
            <!-- Stop speaking -->
            <button type="button" class="voice-btn toolbar-icon-btn" id="speakerBtn"
              aria-label="Stop speaking" title="Stop Speaking">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
              </svg>
            </button>
            <!-- Attach menu ("+") — ChatGPT-style single trigger consolidating
                 image and document attachment behind one popup with two options. -->
            <div class="attach-menu" id="attachMenu">
              <button type="button" class="voice-btn toolbar-icon-btn attach-menu-btn" id="attachMenuBtn"
                aria-label="Add photos or files" aria-haspopup="true" aria-expanded="false"
                title="Add photos or files">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19"/>
                  <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </button>
              <div class="attach-menu-dropdown menu-popup" id="attachMenuDropdown">
                <button type="button" id="addImageMenuItem" title="Attach an image for visual analysis">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                  </svg>
                  Add photos
                </button>
                <button type="button" id="addFileMenuItem" title="Attach a .txt, .md, or .pdf file to ask questions about">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                  </svg>
                  Add files
                </button>
              </div>
            </div>
          </div>
          <div class="toolbar-right">
            <span id="charCounter" class="char-counter"></span>
            <button type="button" class="send-btn" id="sendBtn"
              title="Send message" aria-label="Send message" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
            </button>
            <button type="button" class="stop-streaming-btn" id="stopBtn"
              title="Stop response" aria-label="Stop response">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="5" y="5" width="14" height="14" rx="2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      </div>

      <div id="navRail" class="nav-rail" aria-hidden="true"></div>
    </div>

    <div id="sidebarBackdrop"></div>
  </div>

  <!-- Bottom-left account menu — anchored to #accountTrigger, opens upward -->
  <div class="menu-popup" id="accountMenu" role="menu">
    <button type="button" id="settingsMenuItem">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
    </button>
    <hr>
    <form id="logoutForm" method="post" action="/auth/logout">
      <button type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sign out
      </button>
    </form>
  </div>

  <!-- Active-chat overflow menu — anchored to #chatOverflowBtn, opens downward -->
  <div class="menu-popup" id="chatOverflowMenu" role="menu">
    <button type="button" id="saveBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Save chat
    </button>
    <button type="button" id="exportMdBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      Export MD
    </button>
    <button type="button" id="openBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      Open file
    </button>
    <hr>
    <button type="button" id="closeBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      Close window
    </button>
  </div>

  <div id="settingsRoot"></div>

</body>

</html>
